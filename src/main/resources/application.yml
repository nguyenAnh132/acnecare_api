server:
  port: 9090
  servlet:
    context-path: /api

spring:
  application:
    name: acnecare-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/acnecare}
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  signer-key: ${SIGNER_KEY:fb886b389ba6cd149a7deef483af664b62ff17776eb0d04a991251c0e4fba92e}
  access-token-valid-duration: ${ACCESS_TOKEN_VALID_DURATION:900}
  refresh-token-valid-duration: ${REFRESH_TOKEN_VALID_DURATION:604800}

auth:
  cookie:
    access-token-name: "access_token"
    refresh-token-name: "refresh_token"
    http-only: true
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    max-access-token-age: 3600
    max-refresh-token-age: 604800
    access-path: /
    refresh-path: /api/auth

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

outbound:
  identity:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com}
    user-info-uri: ${GOOGLE_USER_INFO_URI:https://www.googleapis.com}

storage:
  upload-dir: ./uploads
  base-url: ${STORAGE_BASE_URL:http://localhost:9090/api/files}
  max-file-size: 10485760
  allowed-types: image/jpeg,image/png,image/webp,image/gif,application/pdf
  max-user-size: 209715200
  max-facescan-user-size: 524288000
